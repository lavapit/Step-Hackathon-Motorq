global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ingest-gateway"
    static_configs:
      - targets: ["ingest-gateway:8443"]

  - job_name: "stream-processor"
    static_configs:
      - targets: ["stream-processor:9090"]

  - job_name: "api-service"
    static_configs:
      - targets: ["api-service:8000"]

  - job_name: "ml-service"
    static_configs:
      - targets: ["ml-service:8001"]

  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]
